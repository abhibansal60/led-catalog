name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute version metadata
        id: version
        run: |
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "app_version=$(date -u +%d%m%y)-01" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VITE_BUILD_TIMESTAMP: ${{ steps.version.outputs.build_timestamp }}
          VITE_COMMIT_REF: ${{ github.sha }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: led-catalog
          directory: dist
          branch: ${{ github.head_ref || github.ref_name }}
          wranglerVersion: "4.45.1"

